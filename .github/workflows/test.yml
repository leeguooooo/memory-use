name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: sh -n install.sh && sh -n scripts/release.sh && sh -n template/.githooks/pre-commit
  windows-state:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -p test_hook_state.py -v
      - run: python -m unittest discover -s tests -p test_context_budget.py -v
      - run: python -m unittest discover -s tests -p test_memory_use.py -k test_eval_ -v
      - run: python -m unittest discover -s tests -p test_secret_put.py -v
      - run: python -m unittest discover -s tests -p test_failure_relevance.py -v
      - run: python -m unittest discover -s tests -p test_prompt_hook.py -v

  security:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/plugin-security.yml

  prepare-release:
    needs: [test, windows-state, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: prepare-release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: bump version and tag releasable commits
        id: prepare
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if [ "$(git rev-parse origin/main)" != "$TESTED_SHA" ]; then
            echo "Newer main commit exists; its CI will prepare the release"
            exit 0
          fi
          tag="$(python3 scripts/prepare-release.py)"
          if [ -z "$tag" ]; then
            echo "No releasable commits since the last tag"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m "chore(release): $tag"
          git tag "$tag"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # A release published with GITHUB_TOKEN does not fire `release: published`,
  # so the assets workflow is called directly.
  publish:
    needs: prepare-release
    if: needs.prepare-release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - run: gh release create "$TAG" --verify-tag --title "memory-use ${TAG#v}" --generate-notes

  release:
    needs: [prepare-release, publish]
    if: needs.prepare-release.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ needs.prepare-release.outputs.tag }}
