name: Release assets
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Verify version and build portable source archive
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), tag
          version = re.search(r'^VERSION = "([^"]+)"$', Path('scripts/memory_use.py').read_text(), re.M)[1]
          assert tag == 'v' + version, (tag, version)
          PY
          mkdir -p dist
          git archive --format=tar.gz --prefix="memory-use-${TAG#v}/" --output="dist/memory-use-$TAG.tar.gz" HEAD
          cd dist
          sha256sum "memory-use-$TAG.tar.gz" > "memory-use-$TAG.tar.gz.sha256"
      - name: Attach archive and checksum to this release
        run: gh release upload "$TAG" "dist/memory-use-$TAG.tar.gz" "dist/memory-use-$TAG.tar.gz.sha256" --clobber
